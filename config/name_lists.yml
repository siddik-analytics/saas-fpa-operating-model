# Curated word lists for synthetic entity names.
#
# Customer naming convention (PHASE1_SPEC 2.1, binding):
#   [Surname or Place] [Trade] [Suffix]
# Names must read as real commercial contracting firms operating in the US and Canada.
# Explicitly banned tokens are listed at the bottom and enforced by the validation suite.

customer_name:

  # Family surnames used by owner-founded contracting firms.
  surnames:
    - Delgado
    - Harrow
    - Vandermeer
    - Kowalczyk
    - Brannigan
    - Okonkwo
    - Petrosian
    - Ruzicka
    - Halvorsen
    - Marchetti
