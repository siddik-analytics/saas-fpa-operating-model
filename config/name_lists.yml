    - Rio Grande
    - Shenandoah
    - Susquehanna
    - Laurentian
    - Okanagan
    - Saskatoon
    - Annapolis Valley
    - Mohawk Valley
    - Hudson Valley
    - Ozark
    - Cumberland
    - Blue Ridge
    - Kettle Moraine
    - Palouse
    - Wasatch
    - Teton
    - Sierra Nevada
    - Panhandle
    - Lowcountry
    - Brazos
    - Chinook
    - Fraser Valley
    - Red River

  # Coined-but-plausible operating names. These read as regional service brands,
  # not as software startups.
  brandables:
    - Brightline
    - Ironbridge
    - Summit Line
    - Keystone
    - Northgate
    - Silverpoint
    - Copperfield
    - Redstone
    - Blackhawk
    - Cornerstone
    - Meridian
    - Pinnacle Point
    - Stonebridge
    - Harborview
    - Riverworks
    - Fieldstone
    - Anchor Bay
    - Clearwater
    - Granite Peak
    - Lantern

  # Trades. Weighted toward the trades a field-service management product actually serves.
  trades:
    - Electric
    - Electrical Contractors
    - Mechanical
    - Mechanical Contractors
    - Plumbing & Heating
    - Plumbing
    - HVAC
    - Heating & Air
    - Refrigeration
    - Fire Protection
    - Fire & Life Safety
    - Roofing
    - Sheet Metal
    - Controls
    - Building Services
    - Facilities Group
    - Facility Services
    - Industrial Services
    - Energy Services
    - Air Systems
    - Boiler Works
    - Pipefitting
    - Elevator Services
    - Security Systems
    - Landscape Services
    - Glass & Glazing
    - Utility Services
    - Mechanical Systems
    - Property Services
    - Restoration

  # Legal or descriptive suffixes. Blank entries are intentional -- most contractors
  # trade under a bare name.
  suffixes:
    - ""
    - ""
    - ""
    - ""
    - "Inc."
    - "LLC"
    - "Co."
    - "Group"
    - "Corp."
    - "Partners"
    - "& Sons"
    - "Services"
    - "Holdings"

  # Weighting across the three name construction patterns.
  pattern_weights:
    surname_trade: 0.46
    place_trade: 0.34
    brandable_trade: 0.20

  # Tokens that must never appear. PHASE1_SPEC 2.1 bans these outright, plus the
  # defaults a language model reaches for. Matched on whole words by
  # src/validate_sources.py: "Rio Grande Air Systems" is a plausible contractor
  # name and must not trip the "AI" token.
  banned_tokens:
    - Acme
    - Global
    - Innovate
    - TechFlow
    - NextGen
    - Solutions Inc
    - Synergy
    - Dynamics
    - Nexus
    - Vertex
    - Apex
    - Quantum
    - Cyber
    - Digital
    - Smart
    - AI
    - Cloud
    - Data

