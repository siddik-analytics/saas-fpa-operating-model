    - Oyelaran
    - Prentice
    - Quintero
    - Rasmussen
    - Stavros
    - Thibodeaux
    - Uphoff
    - Villanueva
    - Whitcomb
    - Yarborough
    - Zamora
    - Ackerley
    - Boyington
    - Chaudhry
    - Danforth
    - Eskildsen
    - Fontaine
    - Grimaldi
    - Holloway
    - Iverson
    - Jessup
    - Kearney
    - Lomeli
    - Mulcahy
    - Northrup
    - Ostrowski
    - Pemberton

  # Place-derived names: regions, watersheds, ranges, corridors.
